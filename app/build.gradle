plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.papalegua.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.papalegua.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "3.0.1"
    }

    signingConfigs {
        release {
            storeFile file("../papalegua.keystore")
            storePassword "52162120"
            keyAlias "papalegua"
            keyPassword "52162120"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    // Firebase Cloud Messaging (notificações push)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // Login com Google (Credential Manager - fluxo oficial atual)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Cliente Socket.io (compativel com Socket.IO v4 do backend)
    implementation('io.socket:socket.io-client:2.1.2') {
        exclude group: 'org.json', module: 'json'
    }
}
